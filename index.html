<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Situmorang | Portfolio System</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --accent: #0055ff;
            --line: #000000;
            --card-bg: #ffffff;
        }

        body.dark-mode {
            --bg: #1a1a1a;
            --text: #f0f0f0;
            --accent: #4d8cff;
            --line: #f0f0f0;
            --card-bg: #252525;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Karla', sans-serif;
            margin: 0;
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.4s, color 0.4s;
        }

        /* Fixed Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--bg);
            padding: 20px 10%;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
            opacity: 0.95;
            backdrop-filter: blur(10px);
        }

        nav .logo {
            font-family: 'Inria Sans', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            text-decoration: none;
            color: var(--text);
            letter-spacing: -1px;
        }

        nav .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            position: relative;
        }

        nav .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0; width: 0; height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        nav .nav-links a:hover::after { width: 100%; }

        #theme-btn {
            background: none;
            border: 1px solid var(--line);
            color: var(--text);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            transition: 0.2s;
        }
        #theme-btn:hover { background: var(--text); color: var(--bg); }

        /* Animation System */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Layout Elements */
        #view-container { margin-top: 80px; min-height: calc(100vh - 80px); }

        .page-header {
            padding: 100px 10% 40px 10%;
            border-bottom: 2px solid var(--line);
        }

        .page-header h1 {
            font-family: 'Inria Sans', sans-serif;
            font-size: clamp(3rem, 10vw, 6rem);
            text-transform: uppercase;
            margin: 0;
            line-height: 0.85;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 60px;
            align-items: start;
        }

        .lab-controls {
            margin-top: 30px;
            display: grid;
            gap: 15px;
            padding: 25px;
            border: 1px solid var(--line);
            background: var(--card-bg);
        }

        .lab-controls label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        #stochasticCanvas {
            width: 100%;
            height: 380px;
            border: 2px solid var(--line);
            background: var(--bg);
        }

        .content-section { padding: 60px 10%; }

        /* Project Cards */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .project-card {
            border: 2px solid var(--line);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 420px;
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s;
        }

        .project-card:hover { transform: translateY(-10px); border-color: var(--accent); }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            border: 1px solid var(--line);
            letter-spacing: 0.5px;
        }

        /* Services Grid */
        .service-card {
            border: 1px solid var(--line);
            padding: 30px;
            transition: 0.3s;
        }
        .service-card:hover { background: var(--accent); color: white; border-color: var(--accent); }

        .exp-item {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px;
            margin-bottom: 40px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .cv-download-btn {
            display: inline-block;
            padding: 20px 50px;
            border: 3px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-family: 'Inria Sans', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cv-download-btn:hover { background: var(--text); color: var(--bg); transform: scale(1.05); }

        @media (max-width: 900px) {
            .hero-grid { grid-template-columns: 1fr; gap: 40px; }
            .exp-item { grid-template-columns: 1fr; gap: 10px; }
            .page-header h1 { font-size: 3rem; }
            nav { padding: 20px 5%; }
            .content-section, .page-header { padding-left: 5%; padding-right: 5%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home" class="logo">Daniel Situmorang</a>
        <div class="nav-links">
            <a href="#projects">Projects</a>
            <a href="#experience">Experience</a>
            <a href="#services">Freelance</a>
            <a href="#cv">CV / Contact</a>
            <button onclick="toggleTheme()" id="theme-btn">Dark</button>
        </div>
    </nav>

    <div id="view-container"></div>

    <script>
        const projectFiles = ['project1.json', 'project2.json', 'project3.json', 'project4.json'];
        const expFiles = ['exp1.json', 'exp2.json', 'exp3.json'];

        // Animation Engine
        function initObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        // Stochastic Lab Logic (Geometric Brownian Motion)
        let drift = 0.05, vol = 0.2;
        function initStochasticLab() {
            const dIn = document.getElementById('drift'), vIn = document.getElementById('vol');
            if (!dIn) return;
            dIn.oninput = (e) => { drift = parseFloat(e.target.value); document.getElementById('driftVal').innerText = drift; runSimulation(); };
            vIn.oninput = (e) => { vol = parseFloat(e.target.value); document.getElementById('volVal').innerText = vol; runSimulation(); };
            runSimulation();
        }

        function runSimulation() {
            const canvas = document.getElementById('stochasticCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            for(let i=0; i<10; i++) {
                let S = canvas.height/2, steps = 100, dt = 1/steps;
                ctx.beginPath();
                ctx.strokeStyle = i === 0 ? 'var(--accent)' : 'rgba(150,150,150,0.3)';
                ctx.lineWidth = i === 0 ? 3 : 1;
                ctx.moveTo(0, S);
                for(let t=1; t<=steps; t++) {
                    let u1 = Math.random(), u2 = Math.random();
                    let z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
                    S -= S * (drift * dt + vol * Math.sqrt(dt) * z);
                    ctx.lineTo((t/steps)*canvas.width, S);
                }
                ctx.stroke();
            }
        }

        const router = {
            async home() {
                return `
                    <div class="page-header reveal">
                        <div class="hero-grid">
                            <div>
                                <h1>Daniel<br>Situmorang</h1>
                                <p style="margin-top:20px; font-size:1.1rem;">
                                    Chairman of **Gumatika**. 
                                    Math student at **IPB University** specializing in computational modeling and quantitative finance.
                                </p>
                                <div class="lab-controls">
                                    <label>Drift (μ): <span id="driftVal">0.05</span></label>
                                    <input type="range" id="drift" min="-0.5" max="0.5" step="0.01" value="0.05">
                                    <label>Volatility (σ): <span id="volVal">0.2</span></label>
                                    <input type="range" id="vol" min="0.01" max="1" step="0.01" value="0.2">
                                    <p style="font-size:0.6rem; margin-top:10px; opacity:0.7; font-weight:700;">MODEL: GEOMETRIC BROWNIAN MOTION</p>
                                </div>
                            </div>
                            <canvas id="stochasticCanvas" class="reveal"></canvas>
                        </div>
                    </div>
                `;
            },

            async services() {
                return `
                    <div class="page-header reveal"><h1>Freelance<br>Services</h1></div>
                    <div class="content-section reveal">
                        <p style="margin-bottom:40px; max-width:600px; font-size:1.1rem;">Providing expert mathematical modeling, data analysis, and technical typesetting for global clients.</p>
                        <div class="grid-layout">
                            <a href="https://www.fiverr.com/YOUR_USER" target="_blank" class="service-card" style="text-decoration:none; color:inherit;">
                                <h3 style="font-family:'Inria Sans'; text-transform:uppercase;">Fiverr ↗</h3>
                                <p style="font-size:0.9rem;">Order structured gigs for LaTeX typesetting and Python scripting.</p>
                            </a>
                            <a href="https://www.upwork.com/freelancers/~YOUR_ID" target="_blank" class="service-card" style="text-decoration:none; color:inherit;">
                                <h3 style="font-family:'Inria Sans'; text-transform:uppercase;">Upwork ↗</h3>
                                <p style="font-size:0.9rem;">Long-term quantitative analysis and mathematical research projects.</p>
                            </a>
                            <a href="https://wa.me/6281298346299" target="_blank" class="service-card" style="text-decoration:none; color:inherit; background:var(--accent); color:white;">
                                <h3 style="font-family:'Inria Sans'; text-transform:uppercase;">WhatsApp Direct ↗</h3>
                                <p style="font-size:0.9rem;">Urgent inquiries or direct collaboration for local projects.</p>
                            </a>
                        </div>
                    </div>
                `;
            },

            async projects() {
                let html = `<div class="page-header reveal"><h1>Projects</h1></div><div class="content-section grid-layout">`;
                for (const file of projectFiles) {
                    try {
                        const res = await fetch(`projects/${file}`);
                        const data = await res.json();
                        const tagsHtml = data.tags ? data.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';
                        html += `<a href="${data.url}" target="_blank" class="project-card reveal">
                            <div>
                                <div style="font-size:0.75rem; font-weight:700; text-transform:uppercase; margin-bottom:15px; color:#666;">${data.date}</div>
                                <div style="font-family:'Inria Sans'; font-size:1.6rem; text-transform:uppercase; line-height:1.1;">${data.confidential ? '🔒 ' : ''}${data.title}</div>
                                <p style="font-size:0.95rem; margin-top:20px;">${data.description}</p>
                                <div class="tag-container">${tagsHtml}</div>
                            </div>
                            <div style="font-size:0.8rem; font-weight:700; color:var(--accent); text-transform:uppercase;">${data.confidential ? "CONFIDENTIAL ↗" : "VIEW PROJECT ↗"}</div>
                        </a>`;
                    } catch(e) {}
                }
                return html + `</div>`;
            },

            async experience() {
                let html = `<div class="page-header reveal"><h1>Experience</h1></div><div class="content-section">`;
                for (const file of expFiles) {
                    try {
                        const res = await fetch(`experience/${file}`);
                        const data = await res.json();
                        html += `<div class="exp-item reveal">
                            <div style="font-size:0.85rem; font-weight:700; color:#666; text-transform:uppercase;">${data.date}</div>
                            <div>
                                <div style="font-family:'Inria Sans'; font-size:1.5rem; text-transform:uppercase; font-weight:700;">${data.title}</div>
                                <p style="font-size:1.1rem; margin-top:10px;">${data.description}</p>
                            </div>
                        </div>`;
                    } catch(e) {}
                }
                return html + `</div>`;
            },

            async cv() {
                return `
                    <div class="page-header reveal"><h1>CV & Contact</h1></div>
                    <div class="content-section reveal">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 80px;">
                            <div>
                                <h3 style="font-family:'Inria Sans'; text-transform:uppercase; margin-bottom:30px; font-size:1.8rem;">Direct Contact</h3>
                                <p style="font-size:1.1rem;"><strong>Email:</strong> danielsitumo06@gmail.com</p>
                                <p style="font-size:1.1rem;"><strong>Location:</strong> Bekasi, West Java, Indonesia</p>
                            </div>
                            <div style="text-align:center; border: 2px dashed var(--line); padding: 50px;">
                                <h3 style="font-family:'Inria Sans'; text-transform:uppercase; margin-bottom:20px;">Full Résumé</h3>
                                <a href="assets/CV.pdf" target="_blank" class="cv-download-btn">Download PDF ↗</a>
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        async function handleRoute() {
            const hash = window.location.hash.replace('#', '') || 'home';
            const container = document.getElementById('view-container');
            if (router[hash]) {
                container.innerHTML = await router[hash]();
                if (hash === 'home') setTimeout(initStochasticLab, 200);
                setTimeout(initObserver, 100);
            } else { window.location.hash = '#home'; }
            window.scrollTo(0, 0);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            document.getElementById('theme-btn').innerText = document.body.classList.contains('dark-mode') ? 'Light' : 'Dark';
        }

        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('load', handleRoute);
    </script>
</body>
</html>
