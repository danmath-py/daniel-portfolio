<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daniel Situmorang | Portfolio System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <h1>Daniel <br>Situmorang</h1>
        <div class="contact-bar">
            <a href="assets/Daniel_Situmorang_CV.pdf" target="_blank">Download CV</a>
        </div>
    </header>

    <section id="projects-section">
        <h2>Projects</h2>
        <div id="projects-container"></div> </section>

    <section id="experience-section">
        <h2>Experience</h2>
        <div id="experience-container"></div> </section>

    <script>
        // The "Engine" that builds your site from your folders
        async function loadContent(folder, containerId) {
            const container = document.getElementById(containerId);
            
            // In a real system, you'd list files. For MVP, we list them manually:
            const files = folder === 'projects' ? ['project1.json', 'project2.json'] : ['exp1.json', 'exp2.json'];

            for (const file of files) {
                const response = await fetch(`${folder}/${file}`);
                const data = await response.json();
                
                container.innerHTML += `
                    <div class="grid-item">
                        <div class="date">${data.date.toUpperCase()}</div>
                        <div>
                            <div class="title">${data.title}</div>
                            <p>${data.description}</p>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize the layout
        loadContent('projects', 'projects-container');
        loadContent('experience', 'experience-container');
    </script>
</body>
</html>
