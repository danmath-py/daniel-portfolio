<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Situmorang | Portfolio System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --accent: #0055ff;
            --line: #000000;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Karla', sans-serif;
            margin: 0;
            line-height: 1.6;
        }

        /* Hero Section - Restored */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            border-bottom: 2px solid var(--line);
        }

        h1 {
            font-family: 'Inria Sans', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 0.9;
            text-transform: uppercase;
            margin: 0;
        }

        .contact-bar {
            margin-top: 2rem;
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 20px 10%;
            border-bottom: 1px solid #ddd;
            z-index: 100;
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        section { padding: 80px 10%; border-bottom: 1px solid #eee; }

        h2 {
            font-family: 'Inria Sans', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            margin-bottom: 3rem;
            border-top: 2px solid var(--text);
            padding-top: 10px;
            display: inline-block;
        }

        /* The Asymmetric Grid Item */
        .grid-item {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px;
            margin-bottom: 60px;
            transition: transform 0.2s ease;
        }

        .grid-item:hover { transform: translateX(10px); color: var(--accent); }

        .date { font-size: 0.8rem; color: #666; font-weight: 700; text-transform: uppercase; }
        .title { font-size: 1.3rem; font-weight: 700; margin-bottom: 10px; font-family: 'Inria Sans'; text-transform: uppercase;}
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: 2px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn:hover { background: var(--line); color: var(--bg); }

        @media (max-width: 768px) {
            .grid-item { grid-template-columns: 1fr; gap: 10px; }
            .hero, nav, section { padding-left: 5%; padding-right: 5%; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Daniel <br>Situmorang</h1>
        <p style="max-width: 500px; margin-top: 20px;">
            Third-year Mathematics student at IPB University specializing in quantitative analysis and data modeling[cite: 4, 47].
        </p>
        <div class="contact-bar">
            <a href="mailto:dansitumorang@apps.ipb.ac.id">Email [cite: 2]</a>
            <a href="https://github.com/danmath-py/">GitHub [cite: 2]</a>
            <a href="https://linkedin.com/in/danieljas">LinkedIn [cite: 2]</a>
        </div>
    </div>

    <nav>
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="assets/CV (2).pdf" target="_blank">CV [cite: 1]</a>
    </nav>

    <section id="projects">
        <h2>Selected Projects</h2>
        <div id="projects-container"></div>
    </section>

    <section id="experience">
        <h2>Experience</h2>
        <div id="experience-container"></div>
    </section>

    <script>
        // Data engine to load structured JSON from your folders
        async function loadContent(folder, containerId, files) {
            const container = document.getElementById(containerId);
            for (const file of files) {
                try {
                    const response = await fetch(`${folder}/${file}`);
                    const data = await response.json();
                    
                    container.innerHTML += `
                        <div class="grid-item">
                            <div class="date">${data.date}</div>
                            <div>
                                <div class="title">${data.title}</div>
                                <p>${data.description}</p>
                            </div>
                        </div>
                    `;
                } catch (e) { console.error("Error loading " + file, e); }
            }
        }

        // Add your filenames here as you create them in the folders
        loadContent('projects', 'projects-container', ['project1.json', 'project2.json']);
        loadContent('experience', 'experience-container', ['exp1.json', 'exp2.json']);
    </script>
</body>
</html>
