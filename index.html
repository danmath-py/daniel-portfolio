<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Situmorang | Portfolio System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --accent: #0055ff; --line: #000000; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Karla', sans-serif; margin: 0; overflow-x: hidden; }

        /* Persistent Navigation */
        nav {
            position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px); padding: 20px 10%; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        nav .logo { font-family: 'Inria Sans'; text-transform: uppercase; font-weight: 700; text-decoration: none; color: var(--text); }
        nav .nav-links { display: flex; gap: 30px; }
        nav .nav-links a { text-decoration: none; color: var(--text); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }

        /* Dynamic Content Container */
        #view-container { margin-top: 80px; min-height: calc(100vh - 80px); }

        /* Reusable Swiss Styles */
        .page-header { padding: 100px 10% 40px 10%; border-bottom: 2px solid var(--line); }
        .page-header h1 { font-family: 'Inria Sans'; font-size: 4rem; text-transform: uppercase; margin: 0; line-height: 0.9; }
        
        .content-section { padding: 60px 10%; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }

        /* Fade-in Animation for page transitions */
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile Adjustments */
        @media (max-width: 768px) { nav { padding: 20px 5%; } .page-header h1 { font-size: 2.5rem; } }
    </style>
</head>
<body>

    <nav>
        <a href="#home" class="logo">D. Situmorang</a>
        <div class="nav-links">
            <a href="#projects">Projects</a>
            <a href="#experience">Experience</a>
            <a href="#cv">CV</a>
        </div>
    </nav>

    <div id="view-container">
        </div>

    <script>
        // Data sources
        const projectFiles = ['project1.json', 'project2.json', 'project3.json', 'project4.json'];
        const expFiles = ['exp1.json', 'exp2.json', 'exp3.json'];

        const router = {
            async home() {
                return `
                    <div class="page-header fade-in">
                        <h1>Daniel<br>Situmorang</h1>
                        <p style="margin-top:20px; max-width:500px;">Third-year Math undergrad at IPB University specializing in quantitative analysis[cite: 4, 45, 47]. Currently Chairman of Gumatika[cite: 6, 29].</p>
                    </div>
                    <div class="content-section fade-in">
                        <p>Based in Bekasi, West Java. Passionate about Computational Mathematics and Financial Modeling.</p>
                        <a href="#projects" style="color:var(--accent); font-weight:700; text-decoration:none;">VIEW FULL PORTFOLIO ↗</a>
                    </div>
                `;
            },

            async projects() {
                let html = `<div class="page-header fade-in"><h1>Projects</h1></div><div class="content-section grid-layout fade-in">`;
                for (const file of projectFiles) {
                    const res = await fetch(`projects/${file}`);
                    const data = await res.json();
                    const linkText = data.confidential ? "CONFIDENTIAL ↗" : "LIVE DEMO ↗";
                    html += `
                        <div style="border: 2px solid var(--line); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; height: 300px;">
                            <div>
                                <div style="font-size:0.7rem; font-weight:700; margin-bottom:10px;">${data.date}</div>
                                <div style="font-family:'Inria Sans'; font-size:1.4rem; text-transform:uppercase;">${data.confidential ? '🔒 ' : ''}${data.title}</div>
                                <p style="font-size:0.85rem;">${data.description}</p>
                            </div>
                            <a href="${data.url}" target="_blank" style="font-size:0.7rem; font-weight:700; color:var(--accent); text-decoration:none;">${linkText}</a>
                        </div>
                    `;
                }
                html += `</div>`;
                return html;
            },

            async experience() {
                let html = `<div class="page-header fade-in"><h1>Experience</h1></div><div class="content-section fade-in">`;
                for (const file of expFiles) {
                    const res = await fetch(`experience/${file}`);
                    const data = await res.json();
                    html += `
                        <div style="display: grid; grid-template-columns: 200px 1fr; gap: 40px; margin-bottom: 40px; border-top: 1px solid #eee; padding-top: 20px;">
                            <div style="font-size:0.8rem; font-weight:700; color:#666;">${data.date}</div>
                            <div>
                                <div style="font-family:'Inria Sans'; font-size:1.2rem; text-transform:uppercase; font-weight:700;">${data.title}</div>
                                <p style="font-size:0.9rem;">${data.description}</p>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
                return html;
            },

            async cv() {
                return `
                    <div class="page-header fade-in"><h1>Curriculum<br>Vitae</h1></div>
                    <div class="content-section fade-in" style="text-align:center;">
                        <p>Available for data analyst or freelance quantitative roles.</p>
                        <br>
                        <a href="assets/CV (2).pdf" target="_blank" style="display:inline-block; padding:20px 50px; border:3px solid var(--line); color:var(--text); text-decoration:none; font-weight:700; text-transform:uppercase;">Download PDF ↗</a>
                    </div>
                `;
            }
        };

        async function handleRoute() {
            const hash = window.location.hash.replace('#', '') || 'home';
            const container = document.getElementById('view-container');
            
            if (router[hash]) {
                container.innerHTML = await router[hash]();
            } else {
                window.location.hash = '#home';
            }
            window.scrollTo(0, 0);
        }

        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('load', handleRoute);
    </script>
</body>
</html>
