<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Situmorang | Portfolio System</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --accent: #0055ff;
            --line: #000000;
            --card-bg: #ffffff;
        }

        /* Dark Mode Theme Variables */
        body.dark-mode {
            --bg: #1a1a1a;
            --text: #f0f0f0;
            --accent: #4d8cff;
            --line: #f0f0f0;
            --card-bg: #252525;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Karla', sans-serif;
            margin: 0;
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.4s, color 0.4s;
        }

        /* Fixed Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--bg);
            padding: 20px 10%;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
            opacity: 0.95;
            backdrop-filter: blur(10px);
        }

        nav .logo {
            font-family: 'Inria Sans', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            text-decoration: none;
            color: var(--text);
            letter-spacing: -1px;
        }

        nav .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            position: relative;
        }

        /* Nav Underline Animation */
        nav .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0; width: 0; height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        nav .nav-links a:hover::after { width: 100%; }

        #theme-btn {
            background: none;
            border: 1px solid var(--line);
            color: var(--text);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            transition: 0.2s;
        }
        #theme-btn:hover { background: var(--text); color: var(--bg); }

        /* Animation System */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Layout Elements */
        #view-container { margin-top: 80px; min-height: calc(100vh - 80px); }

        .page-header {
            padding: 100px 10% 40px 10%;
            border-bottom: 2px solid var(--line);
        }

        .page-header h1 {
            font-family: 'Inria Sans', sans-serif;
            font-size: clamp(3rem, 10vw, 6rem);
            text-transform: uppercase;
            margin: 0;
            line-height: 0.85;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

        #mandelbrotCanvas {
            width: 100%;
            aspect-ratio: 1/1;
            border: 2px solid var(--line);
            cursor: crosshair;
            background: #000;
        }

        .content-section { padding: 60px 10%; }

        /* Project Cards */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .project-card {
            border: 2px solid var(--line);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 420px;
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s;
        }

        .project-card:hover { transform: translateY(-10px); border-color: var(--accent); }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            border: 1px solid var(--line);
            letter-spacing: 0.5px;
        }

        .exp-item {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px;
            margin-bottom: 40px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .cv-download-btn {
            display: inline-block;
            padding: 20px 50px;
            border: 3px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-family: 'Inria Sans', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cv-download-btn:hover { background: var(--text); color: var(--bg); transform: scale(1.05); }

        @media (max-width: 900px) {
            .hero-grid { grid-template-columns: 1fr; gap: 40px; }
            .exp-item { grid-template-columns: 1fr; gap: 10px; }
            .page-header h1 { font-size: 3rem; }
            nav { padding: 20px 5%; }
            .content-section, .page-header { padding-left: 5%; padding-right: 5%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home" class="logo">Daniel Situmorang</a>
        <div class="nav-links">
            <a href="#projects">Projects</a>
            <a href="#experience">Experience</a>
            <a href="#cv">CV / Contact</a>
            <button onclick="toggleTheme()" id="theme-btn">Dark</button>
        </div>
    </nav>

    <div id="view-container"></div>

    <script>
        const projectFiles = ['project1.json', 'project2.json', 'project3.json', 'project4.json'];
        const expFiles = ['exp1.json', 'exp2.json', 'exp3.json'];

        // Animation Engine
        function initObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        // Mandelbrot Set Logic
        function initMandelbrot() {
            const canvas = document.getElementById('mandelbrotCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w = canvas.width, h = canvas.height;
            let zoom = 1, moveX = -0.5, moveY = 0, maxIter = 100;

            function draw() {
                const imgData = ctx.createImageData(w, h);
                for (let x = 0; x < w; x++) {
                    for (let y = 0; y < h; y++) {
                        let a = (x - w/2) / (0.5 * zoom * w) + moveX;
                        let b = (y - h/2) / (0.5 * zoom * h) + moveY;
                        let ca = a, cb = b, n = 0;
                        while (n < maxIter) {
                            let aa = a * a - b * b, bb = 2 * a * b;
                            a = aa + ca; b = bb + cb;
                            if (a * a + b * b > 4) break;
                            n++;
                        }
                        let pix = (x + y * w) * 4;
                        let bright = n === maxIter ? 0 : (n / maxIter) * 255;
                        imgData.data[pix] = imgData.data[pix+1] = imgData.data[pix+2] = bright;
                        imgData.data[pix+3] = 255;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }
            canvas.onclick = (e) => {
                const r = canvas.getBoundingClientRect();
                moveX += (e.clientX - r.left - w/2) / (0.5 * zoom * w);
                moveY += (e.clientY - r.top - h/2) / (0.5 * zoom * h);
                zoom *= 2; maxIter += 20; draw();
            };
            draw();
        }

        const router = {
            async home() {
                return `
                    <div class="page-header reveal">
                        <div class="hero-grid">
                            <div>
                                <h1>Daniel<br>Situmorang</h1>
                                <p style="margin-top:20px; font-size:1.2rem;">
                                    Third-year Mathematics student at **IPB University** specializing in quantitative analysis and mathematical modeling.
                                </p>
                                <p style="font-size:0.9rem; color:var(--accent); margin-top:20px; font-weight:700;">
                                    COMPUTATIONAL LAB: Click the fractal to explore.
                                </p>
                            </div>
                            <canvas id="mandelbrotCanvas" width="400" height="400" class="reveal"></canvas>
                        </div>
                    </div>
                    <div class="content-section reveal">
                        <p style="font-size:1.1rem;">Currently serving as **Chairman of Gumatika**. Based in **Bekasi, West Java**.</p>
                        <div style="margin-top:40px; display:flex; gap:25px;">
                            <a href="https://linkedin.com/in/danieljas" target="_blank" style="color:var(--text); font-size:1.8rem;"><i class="fa-brands fa-linkedin"></i></a>
                            <a href="https://github.com/danmath-py/" target="_blank" style="color:var(--text); font-size:1.8rem;"><i class="fa-brands fa-github"></i></a>
                        </div>
                    </div>
                `;
            },

            async projects() {
                let html = `<div class="page-header reveal"><h1>Projects</h1></div><div class="content-section grid-layout">`;
                for (const file of projectFiles) {
                    try {
                        const res = await fetch(`projects/${file}`);
                        const data = await res.json();
                        const tagsHtml = data.tags ? data.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';
                        const linkText = data.confidential ? "CONFIDENTIAL • LINKEDIN ↗" : "VIEW PROJECT ↗";
                        html += `
                            <a href="${data.url}" target="_blank" class="project-card reveal">
                                <div>
                                    <div style="font-size:0.75rem; font-weight:700; text-transform:uppercase; margin-bottom:15px; color:#666;">${data.date}</div>
                                    <div style="font-family:'Inria Sans'; font-size:1.6rem; text-transform:uppercase; line-height:1.1;">${data.confidential ? '🔒 ' : ''}${data.title}</div>
                                    <p style="font-size:0.95rem; margin-top:20px;">${data.description}</p>
                                    <div class="tag-container">${tagsHtml}</div>
                                </div>
                                <div style="font-size:0.8rem; font-weight:700; color:var(--accent); text-transform:uppercase; margin-top:20px;">${linkText}</div>
                            </a>
                        `;
                    } catch(e) {}
                }
                return html + `</div>`;
            },

            async experience() {
                let html = `<div class="page-header reveal"><h1>Experience</h1></div><div class="content-section">`;
                for (const file of expFiles) {
                    try {
                        const res = await fetch(`experience/${file}`);
                        const data = await res.json();
                        html += `
                            <div class="exp-item reveal">
                                <div style="font-size:0.85rem; font-weight:700; color:#666; text-transform:uppercase;">${data.date}</div>
                                <div>
                                    <div style="font-family:'Inria Sans'; font-size:1.5rem; text-transform:uppercase; font-weight:700;">${data.title}</div>
                                    <p style="font-size:1.1rem; margin-top:10px;">${data.description}</p>
                                </div>
                            </div>
                        `;
                    } catch(e) {}
                }
                return html + `</div>`;
            },

            async cv() {
                return `
                    <div class="page-header reveal"><h1>CV & Contact</h1></div>
                    <div class="content-section reveal">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 80px;">
                            <div>
                                <h3 style="font-family:'Inria Sans'; text-transform:uppercase; margin-bottom:30px; font-size:1.8rem;">Direct Contact</h3>
                                <p style="font-size:1.1rem;"><strong>Email:</strong> danielsitumo06@gmail.com</p>
                                <p style="font-size:1.1rem;"><strong>Phone:</strong> +62 812 9834 6299</p>
                                <p style="font-size:1.1rem;"><strong>Location:</strong> Bekasi, West Java, Indonesia</p>
                                <div style="margin-top:30px; display:flex; gap:20px;">
                                    <a href="https://linkedin.com/in/danieljas" target="_blank" style="color:var(--text); font-size:1.5rem;"><i class="fa-brands fa-linkedin"></i></a>
                                    <a href="https://github.com/danmath-py/" target="_blank" style="color:var(--text); font-size:1.5rem;"><i class="fa-brands fa-github"></i></a>
                                </div>
                            </div>
                            <div style="text-align:center; border: 2px dashed var(--line); padding: 50px;">
                                <h3 style="font-family:'Inria Sans'; text-transform:uppercase; margin-bottom:20px;">Full Résumé</h3>
                                <p style="font-size:1rem; margin-bottom:30px; color:#666;">Technical skills: Python, Julia, LaTeX, VBScript.</p>
                                <a href="assets/CV.pdf" target="_blank" class="cv-download-btn">Download PDF ↗</a>
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        async function handleRoute() {
            const hash = window.location.hash.replace('#', '') || 'home';
            const container = document.getElementById('view-container');
            if (router[hash]) {
                container.innerHTML = await router[hash]();
                if (hash === 'home') setTimeout(initMandelbrot, 200);
                setTimeout(initObserver, 100);
            } else { window.location.hash = '#home'; }
            window.scrollTo(0, 0);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            document.getElementById('theme-btn').innerText = document.body.classList.contains('dark-mode') ? 'Light' : 'Dark';
        }

        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('load', handleRoute);
    </script>
</body>
</html>
