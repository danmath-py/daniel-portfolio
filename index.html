<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Situmorang | Portfolio System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --accent: #0055ff;
            --line: #000000;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Karla', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            border-bottom: 2px solid var(--line);
        }

        h1 {
            font-family: 'Inria Sans', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 0.9;
            text-transform: uppercase;
            margin: 0;
        }

        /* Carousel Styles */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 20px;
            padding: 40px 10%;
            scrollbar-width: none; /* Firefox */
        }

        .carousel-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .project-card {
            flex: 0 0 400px; /* Fixed width for cards */
            scroll-snap-align: start;
            border: 2px solid var(--line);
            padding: 30px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 350px;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            background-color: var(--text);
            color: var(--bg);
        }

        .project-card .date { font-size: 0.7rem; font-weight: 700; margin-bottom: 20px; }
        .project-card .title { font-family: 'Inria Sans'; font-size: 1.5rem; text-transform: uppercase; line-height: 1.1; }
        .project-card .desc { font-size: 0.9rem; margin-top: 15px; }

        /* Experience Section (Vertical Grid) */
        section#experience { padding: 80px 10%; }
        .exp-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px;
            margin-bottom: 40px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        h2 { font-family: 'Inria Sans'; text-transform: uppercase; padding: 0 10%; margin-top: 80px; }

        @media (max-width: 768px) {
            .project-card { flex: 0 0 85%; }
            .exp-grid { grid-template-columns: 1fr; gap: 10px; }
        }
        /* Add this to your <style> section */
        .social-icon {
            font-size: 1.5rem; /* Large enough to be accessible but clean */
            color: var(--text);
            text-decoration: none;
            margin-right: 25px;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .social-icon:hover {
            color: var(--accent);
            transform: translateY(-3px); /* Subtle Swiss-style "pop" */
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Daniel <br>Situmorang</h1>
        <div class="contact-bar" style="margin-top:20px;">
            <a href="https://linkedin.com/in/danieljas" target="_blank" class="social-icon">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="https://github.com/danmath-py/" target="_blank" class="social-icon">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://instagram.com/dan.j.a.s" target="_blank" class="social-icon">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="mailto:dansitumorang@apps.ipb.ac.id" class="social-icon">
                <i class="fa-regular fa-envelope"></i>
            </a>
        </div>
        <div class="contact-bar" style="margin-top:20px;">
            <a href="mailto:dansitumorang@apps.ipb.ac.id" style="color:var(--text); text-decoration:none; margin-right:20px;">EMAIL</a>
            <a href="https://github.com/danmath-py/" style="color:var(--text); text-decoration:none;">GITHUB</a>
        </div>
    </div>

    <h2>Projects</h2>
    <div class="carousel-container" id="projects-container">
        </div>

    <section id="experience">
        <h2 style="padding:0; margin-top:0; border-bottom: 2px solid var(--line); padding-bottom: 10px;">Experience</h2>
        <div id="experience-container">
            </div>
    </section>

    <script>
        // Updated Engine for Carousel and Experience
async function loadPortfolio() {
    const projectFiles = ['project1.json', 'project2.json', 'project3.json', 'project4.json'];
    const expFiles = ['exp1.json', 'exp2.json', 'exp3.json']; // Ensure you have these 3 files
    
    const pContainer = document.getElementById('projects-container');
    const eContainer = document.getElementById('experience-container');

    // 1. Load Projects
    for (const file of projectFiles) {
        try {
            const res = await fetch(`projects/${file}`);
            if (!res.ok) throw new Error(`File not found: ${file}`);
            const data = await res.json();
            
            const linkText = data.confidential ? "CONFIDENTIAL • VIEW ON LINKEDIN ↗" : "VIEW PROJECT ↗";
            const lockIcon = data.confidential ? "🔒 " : "";

            pContainer.innerHTML += `
                <a href="${data.url}" class="project-card" target="_blank">
                    <div>
                        <div class="date">${data.date}</div>
                        <div class="title">${lockIcon}${data.title}</div>
                        <p class="desc">${data.description}</p>
                    </div>
                    <div style="font-size: 0.7rem; font-weight:700; letter-spacing: 1px; color: var(--accent);">
                        ${linkText}
                    </div>
                </a>
            `;
        } catch (err) {
            console.error("Error loading project:", err);
        }
    }

    // 2. Load Experience (Moved OUTSIDE the project loop)
    for (const file of expFiles) {
        try {
            const res = await fetch(`experience/${file}`);
            if (!res.ok) throw new Error(`File not found: ${file}`);
            const data = await res.json();
            
            eContainer.innerHTML += `
                <div class="exp-grid">
                    <div style="font-size: 0.8rem; font-weight:700; color:#666;">${data.date}</div>
                    <div>
                        <div style="font-family:'Inria Sans'; font-size:1.2rem; text-transform:uppercase; font-weight:700;">${data.title}</div>
                        <p style="font-size:0.9rem;">${data.description}</p>
                    </div>
                </div>
            `;
        } catch (err) {
            console.error("Error loading experience:", err);
        }
    }
}

loadPortfolio();
    </script>
</body>
</html>
