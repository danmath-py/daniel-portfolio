<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Situmorang | Portfolio System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --accent: #0055ff; --line: #000000; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Karla', sans-serif; margin: 0; overflow-x: hidden; }

        /* Navigation */
        nav {
            position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px); padding: 20px 10%; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        nav .logo { font-family: 'Inria Sans'; text-transform: uppercase; font-weight: 700; text-decoration: none; color: var(--text); }
        nav .nav-links { display: flex; gap: 30px; }
        nav .nav-links a { text-decoration: none; color: var(--text); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }

        /* Container */
        #view-container { margin-top: 80px; min-height: calc(100vh - 80px); }

        /* Swiss Layout Elements */
        .page-header { padding: 80px 10% 40px 10%; border-bottom: 2px solid var(--line); }
        .page-header h1 { font-family: 'Inria Sans'; font-size: clamp(2.5rem, 6vw, 4rem); text-transform: uppercase; margin: 0; line-height: 0.9; }
        
        .content-section { padding: 60px 10%; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }

        /* Experience Specifics */
        .exp-item { display: grid; grid-template-columns: 200px 1fr; gap: 40px; margin-bottom: 40px; border-top: 1px solid #eee; padding-top: 20px; }

        /* Animation */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) { .exp-item { grid-template-columns: 1fr; gap: 10px; } .page-header h1 { font-size: 2.5rem; } }
    </style>
</head>
<body>

    <nav>
        <a href="#home" class="logo">Daniel JA Situmorang</a>
        <div class="nav-links">
            <a href="#projects">Projects</a>
            <a href="#experience">Experience</a>
            <a href="#cv">CV</a>
        </div>
    </nav>

    <div id="view-container"></div>

    <script>
        // File registries
        const projectFiles = ['project1.json', 'project2.json', 'project3.json', 'project4.json'];
        const expFiles = ['exp1.json', 'exp2.json', 'exp3.json'];

        const router = {
            async home() {
                return `
                    <div class="page-header fade-in">
                        <h1>Daniel<br>Situmorang</h1>
                        <p style="margin-top:20px; max-width:550px; font-size:1.1rem;">
                            Third-year Mathematics student at IPB University specializing in quantitative analysis, 
                            data modeling, and end-to-end data pipeline development[cite: 4].
                        </p>
                    </div>
                    <div class="content-section fade-in">
                        <p>Currently serving as <strong>Chairman of Gumatika</strong>[cite: 6, 29]. Based in Bekasi, West Java[cite: 2].</p>
                        <div style="margin-top:30px; display:flex; gap:20px;">
                            <a href="https://linkedin.com/in/danieljas" target="_blank" style="color:var(--text); font-size:1.5rem;"><i class="fa-brands fa-linkedin"></i></a>
                            <a href="https://github.com/danmath-py/" target="_blank" style="color:var(--text); font-size:1.5rem;"><i class="fa-brands fa-github"></i></a>
                        </div>
                    </div>
                `;
            },

            async projects() {
                let html = `<div class="page-header fade-in"><h1>Projects</h1></div><div class="content-section grid-layout fade-in">`;
                for (const file of projectFiles) {
                    try {
                        const res = await fetch(`projects/${file}`);
                        const data = await res.json();
                        const linkText = data.confidential ? "CONFIDENTIAL ↗" : "VIEW PROJECT ↗";
                        html += `
                            <div style="border: 2px solid var(--line); padding: 30px; display: flex; flex-direction: column; justify-content: space-between; height: 350px;">
                                <div>
                                    <div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; margin-bottom:15px; color:#666;">${data.date}</div>
                                    <div style="font-family:'Inria Sans'; font-size:1.5rem; text-transform:uppercase; line-height:1.1;">${data.confidential ? '🔒 ' : ''}${data.title}</div>
                                    <p style="font-size:0.9rem; margin-top:15px;">${data.description}</p>
                                </div>
                                <a href="${data.url}" target="_blank" style="font-size:0.75rem; font-weight:700; color:var(--accent); text-decoration:none;">${linkText}</a>
                            </div>
                        `;
                    } catch(e) { console.error(e); }
                }
                html += `</div>`;
                return html;
            },

            async experience() {
                let html = `<div class="page-header fade-in"><h1>Experience</h1></div><div class="content-section fade-in">`;
                for (const file of expFiles) {
                    try {
                        const res = await fetch(`experience/${file}`);
                        const data = await res.json();
                        html += `
                            <div class="exp-item">
                                <div style="font-size:0.8rem; font-weight:700; color:#666; text-transform:uppercase;">${data.date}</div>
                                <div>
                                    <div style="font-family:'Inria Sans'; font-size:1.4rem; text-transform:uppercase; font-weight:700;">${data.title}</div>
                                    <p style="font-size:1rem; margin-top:10px;">${data.description}</p>
                                </div>
                            </div>
                        `;
                    } catch(e) { console.error(e); }
                }
                html += `</div>`;
                return html;
            },

            async cv() {
                return `
                    <div class="page-header fade-in"><h1>Curriculum<br>Vitae</h1></div>
                    <div class="content-section fade-in" style="text-align:center; padding: 120px 10%;">
                        <p style="font-size:1.2rem; margin-bottom:40px;">Download my full professional summary and technical expertise.</p>
                        <a href="assets/CV (2).pdf" target="_blank" style="display:inline-block; padding:20px 60px; border:3px solid var(--line); color:var(--text); text-decoration:none; font-weight:700; text-transform:uppercase; letter-spacing:2px; transition:0.3s;" onmouseover="this.style.background='black';this.style.color='white'" onmouseout="this.style.background='none';this.style.color='black'">
                            Download PDF ↗
                        </a>
                    </div>
                `;
            }
        };

        async function handleRoute() {
            const hash = window.location.hash.replace('#', '') || 'home';
            const container = document.getElementById('view-container');
            
            if (router[hash]) {
                container.innerHTML = await router[hash]();
            } else {
                window.location.hash = '#home';
            }
            window.scrollTo(0, 0);
        }

        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('load', handleRoute);
    </script>
</body>
</html>
